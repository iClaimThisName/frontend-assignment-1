<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="../styles/setup.css"
      rel="stylesheet"
      type="text/css"
      media="all"
    />
    <link
      href="../styles/style.css"
      rel="stylesheet"
      type="text/css"
      media="all"
    />
    <link
      href="../styles/nav-bar.css"
      rel="stylesheet"
      type="text/css"
      media="all"
    />
    <link
      href="../styles/contact.css"
      rel="stylesheet"
      type="text/css"
      media="all"
    />
    <link
      href="../styles/responsiveness.css"
      rel="stylesheet"
      type="text/css"
      media="all"
    />
    <title>Bits 'n Bobs Studios</title>
  </head>
  <body>
    <div class="navigation-bar">
      <a href="../index.html" class="tab">
        <div class="tab-text">home</div>
      </a>
      <a href="./games.html" class="tab">
        <div class="tab-text">games</div>
      </a>
      <a href="./about.html" class="tab">
        <div class="tab-text">about</div>
      </a>
      <a href="./contact.html" class="tab-rounded">
        <div class="tab-text selected">contact</div>
      </a>
    </div>
    <div class="main">
      <form
        action="MAILTO:rebecca.rupert@learnet.se?subject=Form Submission"
        enctype="text/plain"
        method="post"
        class="contact-grid-container"
      >
        <div class="contact-grid-item contact-header">Contact form</div>
        <div class="contact-grid-item contact-input">
          <div class="contact-label">Name</div>
          <input
            required
            type="text"
            id="name"
            name="name"
            placeholder="Name"
          />
        </div>
        <div class="contact-grid-item contact-input">
          <div class="contact-label">Email</div>
          <input
            required
            type="text"
            id="email"
            name="email"
            placeholder="Email"
          />
        </div>
        <fieldset class="contact-grid-item contact-category">
          <div class="contact-label">Category</div>
          <label
            ><input
              required
              type="radio"
              name="category"
              value="feedback"
            />feedback</label
          >
          <label
            ><input
              required
              type="radio"
              name="category"
              value="bug report"
            />bug report</label
          >
          <label
            ><input
              required
              type="radio"
              name="category"
              value="career"
            />career</label
          >
        </fieldset>
        <div class="contact-grid-item contact-message">
          <div class="contact-label">type message</div>
          <textarea
            required
            type="textarea"
            id="message"
            name="message"
            placeholder="type message here..."
          >
          </textarea>
        </div>
        <div class="contact-grid-item contact-submit">
          <input type="submit" value="submit" />
        </div>
      </form>
    </div>
    <div class="footer">&copy2026 Bits 'n Bobs Studios</div>
  </body>
</html>
